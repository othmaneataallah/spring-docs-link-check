name: self-check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Dogfood (full scope over this repo)
        run: python src/check.py --scope full --paths 'tests/fixtures/**/*.adoc'
