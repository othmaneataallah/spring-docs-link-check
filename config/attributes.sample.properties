# Sample AsciiDoc attributes for tests (mirrors the real
# buildSrc/.../antora-asciidoc-attributes.properties keys used by spring-boot).
# Note: spring-grpc docs() links use the minor version (LinkedVersion), e.g.
# springGrpcVersion=1.1.1 -> https://docs.spring.io/spring-grpc/reference/1.1
url-spring-grpc-docs=https://docs.spring.io/spring-grpc/reference/1.1
url-grpc-api-javadoc=https://javadoc.io/doc/io.grpc/grpc-api/1.0
